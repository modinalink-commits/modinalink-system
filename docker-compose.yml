# Matches the existing Traefik on srv2094141 (entrypoint websecure, resolver letsencrypt).
x-laravel: &laravel
  APP_NAME: ModinaLink
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: https://modinalink.com
  APP_TIMEZONE: Asia/Dhaka
  FRONTEND_URL: https://modinalink.com
  CORS_ALLOWED_ORIGINS: https://modinalink.com,https://www.modinalink.com
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: modinalink
  DB_USERNAME: modinalink
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: modinalink
      MYSQL_USER: modinalink
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    networks: [default]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"], interval: 10s, retries: 10 }

  api:
    build: https://github.com/modinalink-commits/modinalink-system.git#main:backend
    restart: unless-stopped
    environment:
      <<: *laravel
      RUN_MIGRATIONS: "1"
    depends_on: { db: { condition: service_healthy } }
    volumes: [storage:/var/www/html/storage]
    networks: [default]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ml-api.rule=Host(`modinalink.com`) && PathPrefix(`/api`)
      - traefik.http.routers.ml-api.priority=20
      - traefik.http.routers.ml-api.entrypoints=websecure
      - traefik.http.routers.ml-api.tls.certresolver=letsencrypt
      - traefik.http.services.ml-api.loadbalancer.server.port=80

  queue:
    build: https://github.com/modinalink-commits/modinalink-system.git#main:backend
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *laravel
      RUN_MIGRATIONS: "0"
    depends_on: [api]
    volumes: [storage:/var/www/html/storage]
    networks: [default]

  scheduler:
    build: https://github.com/modinalink-commits/modinalink-system.git#main:backend
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *laravel
      RUN_MIGRATIONS: "0"
    depends_on: [api]
    volumes: [storage:/var/www/html/storage]
    networks: [default]

  web:
    build:
      context: https://github.com/modinalink-commits/modinalink-system.git#main:frontend
      args: { NEXT_PUBLIC_API_URL: https://modinalink.com/api }
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.ml-web.rule=Host(`modinalink.com`) || Host(`www.modinalink.com`)
      - traefik.http.routers.ml-web.priority=10
      - traefik.http.routers.ml-web.entrypoints=websecure
      - traefik.http.routers.ml-web.tls.certresolver=letsencrypt
      - traefik.http.services.ml-web.loadbalancer.server.port=3000

volumes: { dbdata: {}, storage: {} }
